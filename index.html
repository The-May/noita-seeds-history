<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noita Daily Seed Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #7dd3fc;
    --accent2: #c4b5fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.25rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .sub a { color: var(--accent); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 0.6rem 0.8rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  td.seed {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent);
  }
  td.practice-seed {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent2);
  }
  td.hash {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    font-size: 0.75rem;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr:hover { background: #1c2029; }
  .today { color: #4ade80; font-weight: 600; }
  .empty, .error {
    color: var(--muted);
    padding: 1rem;
    text-align: center;
  }
  .error { color: #f87171; }
  .count {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.75rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Noita Daily Seed Archive</h1>
  <div class="sub">
    Source: <a href="https://takapuoli.noitagame.com/callback/" target="_blank" rel="noopener">takapuoli.noitagame.com</a>
    &nbsp;·&nbsp;
    Raw JSON: <a href="seed-archive.json">seed-archive.json</a>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th>Date</th>
        <th>Daily Seed</th>
        <th>Daily Practice Seed</th>
        <th>Version Hash</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4" class="empty">Loading…</td></tr>
    </tbody>
  </table>
  <div class="count" id="count"></div>
</div>

<script>
  const todayStr = new Date().toISOString().slice(0, 10);

  fetch('seed-archive.json', { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';

      if (!Array.isArray(data) || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No entries yet.</td></tr>';
        return;
      }

      const sorted = [...data].sort((a, b) => b.date.localeCompare(a.date));

      for (const entry of sorted) {
        const tr = document.createElement('tr');
        const isToday = entry.date === todayStr;
        tr.innerHTML = `
          <td class="${isToday ? 'today' : ''}">${entry.date}${isToday ? ' (today)' : ''}</td>
          <td class="seed">${entry.daily_seed}</td>
          <td class="practice-seed">${entry.daily_practice_seed}</td>
          <td class="hash" title="${entry.version_hash}">${entry.version_hash}</td>
        `;
        tbody.appendChild(tr);
      }

      document.getElementById('count').textContent = `${data.length} day${data.length === 1 ? '' : 's'} archived`;
    })
    .catch(err => {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="4" class="error">Failed to load archive: ${err.message}</td></tr>`;
    });
</script>
</body>
</html>
